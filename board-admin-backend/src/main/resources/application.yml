spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: board-admin-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/board_admin_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:2002}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

  flyway:
    enabled: true
    url: ${DB_URL:jdbc:postgresql://localhost:5432/board_admin_db}
    user: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:2002}

  mail:
    host: smtp.example.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      enabled: true
      # increase limits to avoid LimitedInputStream errors; adjust as needed
      max-file-size: 50MB
      max-request-size: 50MB

app:
  jwt:
    secret: ${APP_JWT_SECRET:${JWT_SECRET:change-this-development-jwt-secret-32-bytes-minimum}}
    expiration: ${APP_JWT_EXPIRATION:${JWT_EXPIRATION_MS:86400000}}
    refresh-expiration: ${APP_JWT_REFRESH_EXPIRATION:${JWT_REFRESH_EXPIRATION_MS:604800000}}

  file:
    upload-dir: ./uploads

  twofactor:
    code-expiration-minutes: 10

supabase:
  url: ${SUPABASE_URL:}
  key: ${SUPABASE_KEY:}
  bucket: ${SUPABASE_BUCKET:Files}
