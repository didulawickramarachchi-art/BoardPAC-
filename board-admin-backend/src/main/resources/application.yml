spring:
  config:
    import: optional:file:.env[.properties],optional:file:env[.properties]

  application:
    name: board-admin-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/board_admin_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:12345}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

  flyway:
    enabled: true
    url: ${DB_URL:jdbc:postgresql://localhost:5432/board_admin_db}
    user: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:12345}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

  servlet:
    multipart:
      enabled: true
      # increase limits to avoid LimitedInputStream errors; adjust as needed
      max-file-size: 50MB
      max-request-size: 50MB

app:
  jwt:
    secret: ${APP_JWT_SECRET:${JWT_SECRET:change-this-development-jwt-secret-32-bytes-minimum}}
    expiration: ${APP_JWT_EXPIRATION:${JWT_EXPIRATION_MS:86400000}}
    refresh-expiration: ${APP_JWT_REFRESH_EXPIRATION:${JWT_REFRESH_EXPIRATION_MS:604800000}}

  file:
    upload-dir: ./uploads

  twofactor:
    code-expiration-minutes: 10

  password-reset:
    frontend-url: ${PASSWORD_RESET_FRONTEND_URL:http://localhost:8080/#/reset-password}
    expiration-minutes: ${PASSWORD_RESET_EXPIRATION_MINUTES:30}

supabase:
  url: ${SUPABASE_URL:}
  key: ${SUPABASE_KEY:}
  bucket: ${SUPABASE_BUCKET:Files}
