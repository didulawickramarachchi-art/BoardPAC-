name: BoardPAC CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B test package
        working-directory: board-admin-backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: board-admin-frontend/frontend_web/package-lock.json
      - run: npm ci
        working-directory: board-admin-frontend/frontend_web
      - run: npm run build
        working-directory: board-admin-frontend/frontend_web
        env:
          VITE_API_BASE_URL: https://apds.slpa.lk/api
